<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wortsuchspiel</title>

  <!-- Favicon (Tab-Symbol): SVG für moderne Browser, PNG für ältere, die kein SVG-Symbol kennen -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6aaa64" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="/fehler.css">
</head>
<body>
<header class="app-header">
  <!-- Links: erst Anleitung, dann Sprache. Die Katze ist nur Schmuck und tritt auf Handys zurück. -->
  <div class="kopf-links">
    <button id="help-button" class="kopf-knopf" aria-label="Anleitung">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9.5" />
        <path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.1" />
        <circle cx="12" cy="17.6" r="0.6" fill="currentColor" />
      </svg>
    </button>
    <button id="sprache" class="sprache-knopf" aria-label="Sprache wechseln"><img id="sprache-flagge" alt="" /></button>
    <img src="icons/cat-silhouette.svg" alt="" class="katze-ecke" />
  </div>
  <h1><img src="icons/icon-192.png" alt="Logo" class="logo" /> Wortsuchspiel</h1>
  <!-- Rechts: Statistik und Einstellungen (dort auch „Fehler melden“ und die Versionsnummer). -->
  <div class="kopf-knoepfe">
    <button id="stats-button" class="kopf-knopf" aria-label="Statistik">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
        <rect x="4" y="12" width="4" height="8" rx="1" />
        <rect x="10" y="4" width="4" height="16" rx="1" />
        <rect x="16" y="8" width="4" height="12" rx="1" />
      </svg>
    </button>
    <button id="settings-button" class="kopf-knopf" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
        <path fill-rule="evenodd" d="M10.3 2h3.4l.5 2.6a7.8 7.8 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.9 7.9 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.8 7.8 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.8 7.8 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.9 7.9 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.8 7.8 0 0 1 1.9-1.1zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" transform="translate(0 1)" />
      </svg>
    </button>
  </div>
</header>

  <main>
    <!-- Das Raster (6 Zeilen x 5 Felder) wird per JavaScript gefüllt. -->
    <!-- Die Hülle gibt dem Raster die freie Höhe vor, siehe .raster-box in style.css. -->
    <div class="raster-box"><div id="raster" class="raster"></div></div>

    <!-- Kurze Einblendung oben über dem Spielfeld, wie im Original: „Nicht in der Liste“, das Lob
         nach einem Sieg oder die Lösung nach einer Niederlage. Leer = unsichtbar (setzt app.js). -->
    <p id="meldung" class="meldung" role="status"></p>
    <div id="tages-frage" class="tages-frage" hidden>
      <span id="tages-frage-text"></span>
      <button id="btn-tag-1" class="modus-knopf"></button>
      <button id="btn-tag-2" class="modus-knopf"></button>
    </div>

    <p class="hint">
      Tippe ein 5-Buchstaben-Wort und drück <strong>Enter</strong>.<br />
    </p>
    <div id="tastatur" class="tastatur"></div>
  </main>

  <!-- Statistik-Dialog: dialog bringt Fokus, Esc-Taste und abgedunkelten Hintergrund schon mit. -->
  <dialog id="stats-dialog" class="stats-dialog" aria-labelledby="stats-title">
    <div class="stats-inhalt">
      <button id="stats-close" class="stats-schliessen" aria-label="Schließen">×</button>
      <h2 id="stats-title"></h2>
      <p id="stats-mode" class="stats-modus"></p>
      <!-- Nach einer Niederlage steht hier die Lösung, damit man sie auch später noch nachlesen kann. -->
      <p id="stats-answer" class="stats-loesung" hidden></p>
      <div class="stats-kacheln">
        <div><strong id="stat-played"></strong><span id="label-played"></span></div>
        <div><strong id="stat-win-rate"></strong><span id="label-win-rate"></span></div>
        <div><strong id="stat-streak"></strong><span id="label-streak"></span></div>
        <div><strong id="stat-best"></strong><span id="label-best"></span></div>
      </div>
      <h3 id="distribution-title"></h3>
      <div id="distribution"></div>
      <p id="next-word" class="naechstes-wort" hidden></p>
      <button id="stats-action" class="stats-aktion" hidden></button>
    </div>
  </dialog>

  <!-- Einstellungen: alles, was nicht zum Spielen gebraucht wird, aber erreichbar sein soll. -->
  <dialog id="settings-dialog" class="stats-dialog" aria-labelledby="settings-title">
    <div class="stats-inhalt">
      <button id="settings-close" class="stats-schliessen" aria-label="Schließen">×</button>
      <h2 id="settings-title">Einstellungen</h2>
      <button type="button" id="settings-report" class="menu-eintrag" data-fehler-melden="1">Fehler melden</button>
      <p class="menu-fuss"><span id="pwa-status">Wortsuchspiel</span><br /><span id="puzzle-number"></span></p>
    </div>
  </dialog>

  <!-- Anleitung: Regeln mit Beispielen. Die Texte und Beispiele setzt app.js je nach Sprache. -->
  <dialog id="help-dialog" class="stats-dialog" aria-labelledby="help-title">
    <div class="stats-inhalt anleitung">
      <button id="help-close" class="stats-schliessen" aria-label="Schließen">×</button>
      <h2 id="help-title"></h2>
      <div id="help-content"></div>
    </div>
  </dialog>

  <!-- Reihenfolge wichtig: erst die Wörter, dann die Spiel-Logik. -->
<script src="woerter.js"></script>
<script src="woerter-en.js"></script>
<script src="evaluate.js"></script>
<script src="app.js"></script>
  <!-- Aufrufzähler von tourelleworks.de: zählt nur, wie oft die App geöffnet wird, ohne Cookie und ohne IP. -->
  <img src="https://tourelleworks.de/zaehler/woerdle.gif" alt="" width="1" height="1" hidden referrerpolicy="no-referrer">
  <script src="/zaehler.js" defer></script>
  <script src="/fehler.js" data-app="woerdle" defer></script>
</body>
</html>
