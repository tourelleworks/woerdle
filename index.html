<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wortsuchspiel</title>

  <!-- Favicon (Tab-Symbol): SVG fuer moderne Browser, PNG als Rueckfallebene -->
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6aaa64" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <img src="icons/cat-silhouette.svg" alt="" class="katze-ecke" />
  <h1><img src="icons/icon-192.png" alt="Logo" class="logo" /> Wortsuchspiel</h1>
  <div class="kopf-knoepfe">
    <button id="stats-button" class="kopf-knopf" aria-label="Statistik">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="currentColor">
        <rect x="4" y="12" width="4" height="8" rx="1" />
        <rect x="10" y="4" width="4" height="16" rx="1" />
        <rect x="16" y="8" width="4" height="12" rx="1" />
      </svg>
    </button>
    <button id="sprache" class="sprache-knopf" aria-label="Sprache wechseln"><img id="sprache-flagge" alt="" /></button>
  </div>
</header>

  <main>
    <div class="modus-wahl">
      <button id="modus-taeglich" class="modus-knopf">Tägliches Wort</button>
      <button id="modus-endlos" class="modus-knopf">Endlos</button>
    </div>
    <!-- Das Raster (6 Zeilen x 5 Felder) wird per JavaScript gefüllt. -->
    <!-- Die Hülle gibt dem Raster die freie Höhe vor, siehe .raster-box in style.css. -->
    <div class="raster-box"><div id="raster" class="raster"></div></div>

    <!-- Kurze Meldungen (z. B. "Gewonnen!") kommen später hier rein. -->
    <p id="meldung" class="meldung"></p>
    <div id="tages-frage" class="tages-frage" hidden>
      <span id="tages-frage-text"></span>
      <button id="btn-tag-1" class="modus-knopf"></button>
      <button id="btn-tag-2" class="modus-knopf"></button>
    </div>
    <button id="neustart" class="neustart" hidden>Nochmal spielen</button>

    <p class="hint">
      Tippe ein 5-Buchstaben-Wort und drück <strong>Enter</strong>.<br />
    </p>
    <div id="tastatur" class="tastatur"></div>
  </main>

  <footer class="app-footer">
    <span id="pwa-status">Web-Version</span>
  </footer>

  <!-- Statistik-Dialog: dialog bringt Fokus, Esc-Taste und abgedunkelten Hintergrund schon mit. -->
  <dialog id="stats-dialog" class="stats-dialog" aria-labelledby="stats-title">
    <div class="stats-inhalt">
      <button id="stats-close" class="stats-schliessen" aria-label="Schließen">×</button>
      <h2 id="stats-title"></h2>
      <p id="stats-mode" class="stats-modus"></p>
      <div class="stats-kacheln">
        <div><strong id="stat-played"></strong><span id="label-played"></span></div>
        <div><strong id="stat-win-rate"></strong><span id="label-win-rate"></span></div>
        <div><strong id="stat-streak"></strong><span id="label-streak"></span></div>
        <div><strong id="stat-best"></strong><span id="label-best"></span></div>
      </div>
      <h3 id="distribution-title"></h3>
      <div id="distribution"></div>
      <p id="next-word" class="naechstes-wort" hidden></p>
      <button id="stats-action" class="stats-aktion" hidden></button>
    </div>
  </dialog>

  <!-- Reihenfolge wichtig: erst die Wörter, dann die Spiel-Logik. -->
<script src="woerter.js"></script>
<script src="woerter-en.js"></script>
<script src="app.js"></script>
  <!-- Aufrufzähler von tourelleworks.de: zählt nur, wie oft die App geöffnet wird, ohne Cookie und ohne IP. -->
  <img src="https://tourelleworks.de/zaehler/woerdle.gif" alt="" width="1" height="1" hidden referrerpolicy="no-referrer">
</body>
</html>
